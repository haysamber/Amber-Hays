<script>
  const pages = [
    "Notebookpages/Notebook_cover.png",
    "Notebookpages/N_0.png",
    "Notebookpages/N_1.png",
    "Notebookpages/N_2.png",
    "Notebookpages/N_3.png",
    "Notebookpages/N_5.png",
    "Notebookpages/N_4.png",
    "Notebookpages/N_6.png",
    "Notebookpages/N_7.png",
    "Notebookpages/N_8.png",
    "Notebookpages/N_9.png",
    "Notebookpages/N_11.png",
    "Notebookpages/N_13.png",
    "Notebookpages/N_14.png",
    "Notebookpages/N_15.png",
    "Notebookpages/N_16.png",
    "Notebookpages/N_17.png",
    "Notebookpages/N_18.png",
    "Notebookpages/N_19.png",
    "Notebookpages/N_20.png",
    "Notebookpages/N_21.png",
    "Notebookpages/N_22.png",
    "Notebookpages/N_23.png",
    "Notebookpages/N_24.png",
    "Notebookpages/N_25.png",
    "Notebookpages/N_26.png",
    "Notebookpages/N_28.png",
    "Notebookpages/N_29.png",
    "Notebookpages/N_30.png",
    "Notebookpages/N_31.png",
    "Notebookpages/N_32.png",
    "Notebookpages/N_33.png",
    "Notebookpages/N_34.png",
    "Notebookpages/N_35.jpg",
    "Notebookpages/N_36.png",
    "Notebookpages/N_37.png",
    "Notebookpages/N_38.png",
    "Notebookpages/back_cover.png"
  ];

  const book = document.getElementById("book");
  const leftEl = document.getElementById("leftPage");
  const rightEl = document.getElementById("rightPage");

const interiorCount = pages.length - 2;
const last = Math.floor(interiorCount / 2) + 1;
let spread = 0;

function setPage(el, src) {
  if (src) {
    el.src = src;
    el.style.visibility = "visible";
  } else {
    el.style.visibility = "hidden";
  }
}

function render() {
  let leftSrc = null;
  let rightSrc = null;

  if (spread === 0) {
    rightSrc = pages[0];                  // front cover alone
  } else if (spread === last) {
    leftSrc = pages[pages.length - 1];    // back cover alone
  } else {
    leftSrc = pages[spread * 2 - 1];
    rightSrc = pages[spread * 2];
  }

  setPage(leftEl, leftSrc);
  setPage(rightEl, rightSrc);

  // slide the lone cover to the middle of the book area
  if (spread === 0) book.style.transform = "translateX(-25%)";
  else if (spread === last) book.style.transform = "translateX(25%)";
  else book.style.transform = "none";
}

function next() { if (spread < last) { spread++; render(); } }
function prev() { if (spread > 0) { spread--; render(); } }

rightEl.addEventListener("click", next);
leftEl.addEventListener("click", prev);

render();
</script>
